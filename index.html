<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="業務手順・問い合わせへの回答方法・システム操作方法を確認するセンターポータルのデモ">
  <title>Center Portal | 業務情報ポータル</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- ヘッダー -->
  <header class="header">
    <a class="header-logo" href="index.html" aria-label="トップページ">
      <span class="logo-mark">CP</span>
      <span class="logo-text">
        <strong>CENTER PORTAL</strong>
        <small>業務情報ポータル</small>
      </span>
    </a>

    <!-- 資料とお知らせを検索し、結果はメインエリアに表示する -->
    <form class="search-form" id="searchForm" role="search">
      <label class="visually-hidden" for="searchInput">
        キーワード検索
      </label>
      <input type="search" id="searchInput" name="keyword" placeholder="キーワード・資料名で検索" autocomplete="off">
      <button type="submit" class="search-button">
        検索
      </button>
    </form>
  </header>

  <main class="main">
    <!-- メインカテゴリー -->
    <nav class="category-nav" aria-label="業務カテゴリー">
      <button type="button" class="category-button" data-category="全体" aria-pressed="false">
        全体
      </button>
      <button type="button" class="category-button is-active" data-category="BD" aria-pressed="true">
        BD
      </button>

      <button type="button" class="category-button" data-category="EB" aria-pressed="false">
        EB
      </button>


    </nav>

    <!-- 詳細カテゴリー・資料一覧 -->
    <section class="content-section" aria-labelledby="contentTitle">
      <div class="section-heading">
        <div>
          <h1 id="contentTitle">BD</h1>
          <p class="section-description">
            必要な業務情報を選択してください。
          </p>
        </div>
      </div>

      <!-- 選択中カテゴリーの詳細カテゴリー、または資料一覧をJavaScriptで表示 -->
      <div class="detail-category-list" id="detailCategoryList">
        <!-- 詳細カテゴリーをJavaScriptで表示 -->
      </div>

      <!-- 検索結果をJavaScriptで挿入する。通常のカテゴリー表示とは独立して切り替える -->
      <section class="search-results" id="searchResults" aria-labelledby="searchResultsTitle" aria-live="polite" hidden>
        <h2 id="searchResultsTitle">検索結果</h2>
        <div id="searchResultsList"></div>
      </section>

      <!-- 選択された資料本文を表示する領域 -->
      <section class="material-detail" id="materialDetail" aria-live="polite" hidden>
        <!-- 選択した資料の詳細を表示 -->
      </section>
    </section>

    <!-- 本日のお知らせ・お知らせ -->
    <!-- 今日のお知らせと通常のお知らせを並べて表示する -->
    <div class="information-grid">
      <!-- 本日のお知らせ -->
      <section class="information-panel" aria-labelledby="dailyAnnouncementsTitle">

        <div class="panel-heading">
          <div class="daily-announcements-heading">
            <div class="daily-date">
              <span id="dailyYear">2026</span>
              <div class="daily-date-line">
                <strong id="dailyMonthDay">10/22</strong>
                <h2 id="dailyAnnouncementsTitle">のお知らせ</h2>
              </div>
            </div>
          </div>
        </div>


        <ul class="information-list" id="historyList">
          <!-- 当日のお知らせをJavaScriptで表示 -->
        </ul>
      </section>

      <!-- お知らせ -->
      <section class="information-panel" aria-labelledby="newsTitle">
        <div class="panel-heading">
          <div>
            <h2 id="newsTitle">お知らせ</h2>
          </div>
        </div>

        <ul class="information-list" id="newsList">
          <!-- お知らせをJavaScriptで表示 -->
        </ul>
      </section>
    </div>


    <!-- スタッフ向けショートカット -->
    <!-- 用途別の資料ショートカット。検索結果は各ボタンの直下に表示 -->
    <section class="shortcut-section" aria-labelledby="shortcutTitle">
      <div class="panel-heading">
        <div>
          <h2 id="shortcutTitle">オペレーター用</h2>
        </div>
      </div>

      <div class="shortcut-list">
        <div class="shortcut-item">
          <button type="button" class="shortcut-button" data-shortcut="test">
            <span class="shortcut-icon" aria-hidden="true">01</span>
            <span>
              <strong>確認テスト用</strong>
              <small>確認テストに関するファイル</small>
            </span>
            <span class="shortcut-arrow" aria-hidden="true">→</span>
          </button>
          <section class="shortcut-results search-results" aria-labelledby="testResultsTitle" aria-live="polite" hidden>
            <h2 id="testResultsTitle">確認テスト用の資料</h2>
            <div class="shortcut-results-list"></div>
          </section>
        </div>

        <div class="shortcut-item">
          <button type="button" class="shortcut-button" data-shortcut="file">
            <span class="shortcut-icon" aria-hidden="true">02</span>
            <span>
              <strong>席替え用</strong>
              <small>席替えファイル一括DL</small>
            </span>
            <span class="shortcut-arrow" aria-hidden="true">→</span>
          </button>
          <section class="shortcut-results search-results" aria-labelledby="fileResultsTitle" aria-live="polite" hidden>
            <h2 id="fileResultsTitle">席替え用の資料</h2>
            <div class="shortcut-results-list"></div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <!-- フッター -->
  <footer class="footer">
    <div class="footer-inner">
      <span>CENTER PORTAL</span>
      <p>架空データを使用したデモサイト</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
